# Fork only: the nether-rifts fixes branch, tested on push. The module's game tests (they run inside
# `:mods:nether-rifts:test`, on a JUnit-started test server) and the client screenshot test.
# Drop this file before the branch goes upstream.

name: nether-rifts-fixes
on:
  push:
    branches: [edvin/nether-rifts-fixes]
  workflow_dispatch:

jobs:
  nether-rifts:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install a virtual display and Mesa
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libgl1-mesa-dri libglx-mesa0 libegl1 mesa-utils mesa-vulkan-drivers

      - name: Datagen
        id: datagen
        run: ./gradlew runDatagen

      # The game tests (TestHelper.runTestServer); the dependencies' own tests are skipped.
      - name: Game tests
        if: ${{ !cancelled() && steps.datagen.outcome == 'success' }}
        run: |
          ./gradlew :mods:nether-rifts:test -x :mods:portal-blocker:test -x :mods:portal-opening:test \
            -x :mods:simple-custom-features:test -x :mods:metacraft-zones:test -x :mods:metacraft-core:test \
            -x :mods:metacraft-config:test -x :mods:metacraft-lib:test

      - name: Checkstyle
        if: ${{ !cancelled() && steps.datagen.outcome == 'success' }}
        run: ./gradlew :mods:nether-rifts:checkstyleMain :mods:nether-rifts:checkstyleTest :mods:nether-rifts:checkstyleGametest

      # With CI set, Loom wraps a client run in its own `xvfb-run`, whose default screen is 8 bits deep:
      # no GLX visual for OpenGL there. Without CI it runs in this one.
      - name: Client screenshot test
        if: ${{ !cancelled() && steps.datagen.outcome == 'success' }}
        timeout-minutes: 30
        run: |
          env -u CI xvfb-run -a -s "-screen 0 1920x1080x24 +extension GLX +render -noreset" \
            ./gradlew :mods:nether-rifts:runClientGameTest

      - name: Game test summary
        if: ${{ always() }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import glob, re
          for path in glob.glob("mods/nether-rifts/build/test-results/test/TEST-*.xml"):
              text = open(path, encoding="utf-8", errors="replace").read()
              for line in re.findall(r"(All \d+ required tests passed.*|\d+ required tests? failed.*|.*tests? failed.*)", text):
                  print(f"- {line.strip()}")
          EOF
          cat "$GITHUB_STEP_SUMMARY" || true

      - name: Upload screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: nether-rifts-screenshots
          path: mods/nether-rifts/build/run/clientGameTest/screenshots/
          if-no-files-found: warn

      - name: Upload reports and logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: nether-rifts-reports-and-logs
          path: |
            mods/nether-rifts/build/test-results/
            mods/nether-rifts/build/reports/tests/
            mods/nether-rifts/build/run/clientGameTest/logs/
            mods/nether-rifts/run/logs/
          if-no-files-found: warn
