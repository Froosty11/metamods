# Fork only: the metacraft-qol review branch, tested on push. The module's game tests run inside
# `:mods:metacraft-qol:test`, on a JUnit-started test server (TestHelper.runTestServer).
# Drop this file before the branch goes upstream.

name: qol-review
on:
  push:
    branches: [edvin/qol-review]
  workflow_dispatch:

jobs:
  qol:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Datagen
        id: datagen
        run: ./gradlew runDatagen

      # The game tests; the dependencies' own tests are skipped.
      - name: Game tests
        if: ${{ !cancelled() && steps.datagen.outcome == 'success' }}
        run: |
          ./gradlew :mods:metacraft-qol:test -x :mods:metacraft-core:test -x :mods:metacraft-config:test \
            -x :mods:metacraft-shaders:test -x :mods:metacraft-lib:test

      - name: Checkstyle
        if: ${{ !cancelled() && steps.datagen.outcome == 'success' }}
        run: ./gradlew :mods:metacraft-qol:checkstyleMain :mods:metacraft-qol:checkstyleTest

      - name: Game test summary
        if: ${{ always() }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import glob, re
          for path in glob.glob("mods/metacraft-qol/build/test-results/test/TEST-*.xml"):
              text = open(path, encoding="utf-8", errors="replace").read()
              for line in re.findall(r"(All \d+ required tests passed.*|\d+ required tests? failed.*|.*tests? failed.*|.*GameTestAssertException.*)", text):
                  print(f"- {line.strip()}")
          EOF
          cat "$GITHUB_STEP_SUMMARY" || true

      - name: Upload reports and logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: qol-reports-and-logs
          path: |
            mods/metacraft-qol/build/test-results/
            mods/metacraft-qol/build/reports/tests/
            mods/metacraft-qol/run/logs/
          if-no-files-found: warn
