plugins {
    id 'net.fabricmc.fabric-loom' version "$loom_version"
    id 'java'
}

version = '1.0.0'
group = 'nu.metacraft'

repositories {
    mavenCentral()
    maven { name = 'Nucleoid'; url = 'https://maven.nucleoid.xyz/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    // Runtime worlds with their own seed; bundled so the server needs only this jar.
    implementation "xyz.nucleoid:fantasy:${project.fantasy_version}"
    include "xyz.nucleoid:fantasy:${project.fantasy_version}"
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release.set(25)
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}
