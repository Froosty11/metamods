// Rivals Paint — Splatoon-style paint prototype for vanilla clients (Polymer). See README.md.
// Standalone: not bundled into dist (root build.gradle standaloneMods); run with mods:rivals-paint:runServer.
version = project.rivals_version

// Server-side game tests (Fabric GameTest API) live in the main source set:
// ./gradlew mods:rivals-paint:runGameTest
// Client screenshot tests (src/gametest, ./gradlew :mods:rivals-paint:runClientGameTest, needs a
// display): a real client joins an in-process server and photographs the paint. -Psodium puts Sodium
// on that client, to see what its terrain pipeline does to the paint shader.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "rivals-clienttest"
		enableGameTests = true
		enableClientGameTests = true
		eula = true
		username = "Tester"
	}
}
if (project.hasProperty('sodium')) {
	dependencies {
		runtimeOnly("maven.modrinth:sodium:${project.sodium}")
	}
}

addPolymerDependency()
dependencies {
	implementation("eu.pb4:polymer-virtual-entity:${project.polymer_version}")
	implementation("eu.pb4:polymer-resource-pack:${project.polymer_version}")
	implementation("eu.pb4:polymer-autohost:${project.polymer_version}")
	// Only the donor-versus-pool game test needs this: it reads polymer-blocks' own table of the vanilla
	// states its BlockModelType pools hand out, to prove no Rivals donor is in one. Nothing in the mod's
	// runtime path touches it, so it is not a fabric.mod.json dependency.
	implementation("eu.pb4:polymer-blocks:${project.polymer_version}")
}
