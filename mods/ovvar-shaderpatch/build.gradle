// Client-only launcher mod: patches the instance's shaderpacks at preLaunch so ovvar and the rift shaders
// render under Iris. No Polymer, no Fabric API of its own (the root build puts Fabric API on every module's
// compile classpath, but fabric.mod.json does not depend on it). Never on a server: it is on no deploy list
// and initDist in the root build.gradle skips it. See README.md.
version = project.ovvar_shaderpatch_version

// The pure Java patcher core, compiled into this mod. Java 11-compatible, dependency-free.
sourceSets {
	main {
		java.srcDir '../ovvar/tools/shaderpatcher/src'
	}
}

// The GLSL the patcher splices in, bundled the way mods/ovvar's patcherResources does (same set, same paths).
tasks.named('processResources') {
	from(project(':mods:ovvar').file('src/main/resources/assets/ovvar/shaders/include/ovvar.glsl'))
	from(project(':mods:metacraft-shaders').file('src/main/resources/assets/metacraft/shaders/include')) {
		include 'rift_common.glsl', 'void_rift.glsl', 'nether_rift.glsl'
	}
}
