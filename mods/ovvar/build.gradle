// Ovvar — student overalls with sewn-on patches for vanilla clients (Polymer). See README.md in this module.
version = project.ovvar_version

// Every art-derived file (armour layers cut from the website overlays, one equipment definition per
// patch combination, icons, lang) comes from src/main/resources/art via data generation: ./gradlew runDatagen.
setupRunDatagen("ovvar")
// Client screenshot tests: a real client joins an in-process dedicated server and compares what it
// sees. Source set src/gametest, task runClientGameTest (needs a display).
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "ovvar-clienttest"
		enableGameTests = true
		enableClientGameTests = true
		eula = true
		username = "Tester"
	}
}

addPolymerDependency()
addConfigDependency()
addSGUIDependency()
// Pockets: the ovve is a bundle whose capacity metacraft-bundles scales (metacraft:bundle_size_factor).
addProjectDependency(":mods:metacraft-bundles")
// With metacraft-resource-packs installed the patch combinations go into a small pack of their own
// that it serves (pack/ComboPack). Never a `depends`: only compat/resource_packs names its types, behind
// FabricLoader.isModLoaded. In the dev/test runtime so the game tests run that way.
dependencies {
	compileOnly project(path: ":mods:metacraft-resource-packs")
	runtimeOnly project(path: ":mods:metacraft-resource-packs")
}
dependencies {
	implementation("eu.pb4:polymer-resource-pack:${project.polymer_version}")
	implementation("eu.pb4:polymer-autohost:${project.polymer_version}")
	implementation("eu.pb4:polymer-virtual-entity:${project.polymer_version}")
	// The design store's JDBC drivers, bundled jar-in-jar (config designs.jdbc.url picks one).
	implementation(include("org.mariadb.jdbc:mariadb-java-client:3.5.10"))
	implementation(include("org.postgresql:postgresql:42.7.13"))
	// Dev/test only: an in-memory database for the JDBC game test; not shipped.
	runtimeOnly("com.h2database:h2:2.5.250")

	// Booklet by Patbox, the server-side guidebook "How to ovvar" is a chapter of (written in
	// metacraft-booklet); /ovvar guide opens it. Bundled jar-in-jar the way metacraft-core bundles Polymer.
	implementation(include("eu.pb4:booklet:${project.booklet_version}"))

	// Danse (gestures) — our AGPL fork, as its own jar, fetched from the fork's GitHub release (README:
	// "The danse fork"; the repository is in the root build.gradle). Compat only, and only
	// in this module's dev/test runtime. Never a `depends`: metacraft.ovvar.compat.danse is the one
	// package that names Danse types and it is reached only behind FabricLoader.isModLoaded("danse"),
	// its mixins behind DanseMixinPlugin.
	// (This Loom auto-remaps plain configurations and the jar already carries Mojang names, so
	// compileOnly/runtimeOnly are the `modCompileOnly`/`modLocalRuntime` of the spec.)
	def danseJar = "Froosty11:danse:${project.danse_version}"
	compileOnly danseJar
	runtimeOnly danseJar
	// Punkphöz is a Blockbench model played by BIL, the way the traders' shopkeepers are (mods/traders).
	implementation include("de.tomalbrc:blockbench-import-library:2.2.0+26.3-rc-3")
	// BIL's and Danse's Polymer module ovvar does not otherwise have (Danse depends on it without including it).
	implementation include("eu.pb4:polymer-resource-pack-extras:${project.polymer_version}")
	// The client gesture test starts a gesture through Danse's own controller rather than its
	// command, so a failure inside Danse surfaces as a stack trace instead of a swallowed chat line.
	gametestCompileOnly danseJar
	runtimeOnly "me.lucko:fabric-permissions-api:0.7.0" // Needed by BIL currently otherwise gametest fails with ClassNotFoundException.
}

// -PovvarBrewery puts Patbox's Brewery (kultur's coordinate) on the dev/test runtime, for the second game
// test run: the Curse of the Spilled Drink is only offered beside Brewery (OvveEnchantments.BREWERY).
// Never a dependency of the shipped mod.
if (project.hasProperty('ovvarBrewery')) {
	dependencies {
		runtimeOnly("maven.modrinth:brewery:${project.brewery_version}")
	}
}

// The shaderpack patcher (tools/shaderpatcher, Java 11+, no dependencies). The double-clickable jar players
// get is the ovvar-client mod's own jar (mods/ovvar-client, Main-Class = the patcher), shipped inside the
// resource pack at assets/ovvar/shaderpatcher/ovvar-client.jar. These source sets only run the fixtures.
sourceSets {
	// The combination asset names and JSON (src/combo, package se.metacraft.ovvar.combo): plain Java and Gson,
	// compiled into this mod and into mods/ovvar-client, so the server's pack and a client's own build agree.
	main {
		java.srcDir 'src/combo/java'
	}
	patcher {
		java.srcDir 'tools/shaderpatcher/src'
	}
	// The fixtures check (tools/shaderpatcher/fixtures), plain main, no test framework.
	patcherTest {
		java.srcDir 'tools/shaderpatcher/test'
		compileClasspath += sourceSets.patcher.output
		runtimeClasspath += sourceSets.patcher.output
	}
}
// The client tests' screenshot measures (src/gametest .../clienttest/ShotMeasures, plain JDK) are pinned by a unit test
// over saved real-GPU frames (src/test, ShotMeasuresTest). Only the gametest classes, not its resources: its
// fabric.mod.json would make the unit test's Fabric loader load the client test mod.
sourceSets.test.compileClasspath += sourceSets.gametest.output.classesDirs
sourceSets.test.runtimeClasspath += sourceSets.gametest.output.classesDirs
tasks.withType(JavaCompile).configureEach {
	if (it.name == 'compilePatcherJava' || it.name == 'compilePatcherTestJava') it.options.release = 11
}
// -PwithKultur: kultur in the dev/game-test runtime, so Punkphöz's default pool (its banner patterns) resolves.
// Dev runtime only, never a `depends`; kultur's runDatagen must have run (./gradlew :mods:metacraft-kultur:runDatagen).
if (project.hasProperty('withKultur')) {
	dependencies {
		runtimeOnly project(path: ':mods:metacraft-kultur')
	}
}

// The shader code the patcher splices in, read by the patcher as resources: the very code the vanilla
// override uses (so patched packs and vanilla never drift apart), metacraft-shaders' rifts, the code
// its item shader includes, and the chapter text colours. The jar and the fixtures see the same files.
def patcherResources = tasks.register('patcherResources', Sync) {
	into layout.buildDirectory.dir('patcher-resources')
	from('src/main/resources/assets/ovvar/shaders/include/ovvar.glsl')
	from('tools/shaderpatcher/chapter_text_colors.glsl')
	from(project(':mods:metacraft-shaders').file('src/main/resources/assets/metacraft/shaders/include')) {
		include 'rift_common.glsl', 'void_rift.glsl', 'nether_rift.glsl'
	}
}
tasks.register('patcherFixtures', JavaExec) {
	group = 'verification'
	description = 'Runs the shader patcher over the shared fixtures (-PupdateGoldens rewrites the expected output).'
	classpath = sourceSets.patcherTest.output + sourceSets.patcher.output + files(patcherResources)
	mainClass = 'metacraft.ovvar.shaderpatcher.Fixtures'
	workingDir = projectDir
	args = ['tools/shaderpatcher/fixtures'] + (project.hasProperty('updateGoldens') ? ['--update'] : [])
}
// The TypeScript port (tools/shaderpatcher/web) runs the same fixtures, so the two patchers can't drift apart
// unnoticed. Needs node on the PATH; without it the task logs and skips.
def nodeExe = System.getenv('PATH')?.split(File.pathSeparator as String)?.collectMany { [new File(it, 'node'), new File(it, 'node.exe')] }?.find { it.isFile() && it.canExecute() }
// node runs .ts natively (type stripping, no flag) from 22.18.0 on 22.x and from 23.6.0 on 23+; older: skip, never fail.
def nodeRunsTs = { File exe ->
	try {
		def proc = new ProcessBuilder(exe.toString(), '--version').redirectErrorStream(true).start()
		def text = proc.inputStream.text.trim()
		proc.waitFor()
		def m = text =~ /^v(\d+)\.(\d+)\.(\d+)/
		if (!m.find()) return false
		int major = m.group(1) as int, minor = m.group(2) as int
		major >= 24 || (major == 23 && minor >= 6) || (major == 22 && minor >= 18)
	} catch (Exception e) {
		false
	}
}
tasks.register('patcherFixturesTs', Exec) {
	group = 'verification'
	description = 'Runs the TypeScript shader patcher over the shared fixtures (needs node on the PATH).'
	workingDir = projectDir
	commandLine((nodeExe ?: 'node').toString(), '--test', 'tools/shaderpatcher/web/patcher.test.ts')
	onlyIf {
		if (nodeExe == null) {
			logger.lifecycle('patcherFixturesTs: node is not on the PATH, skipping the TypeScript patcher fixtures')
			return false
		}
		if (!nodeRunsTs(nodeExe)) {
			logger.lifecycle('patcherFixturesTs: node is too old to run .ts (needs 22.18+ or 23.6+), skipping the TypeScript patcher fixtures')
			return false
		}
		true
	}
}
tasks.register('patcherRunTest', JavaExec) {
	group = 'verification'
	description = 'Runs Patcher.run through its chooser seam: cancel, a pick, and no-GUI usage.'
	classpath = sourceSets.patcherTest.output + sourceSets.patcher.output + files(patcherResources)
	mainClass = 'metacraft.ovvar.shaderpatcher.PatcherRunTest'
	workingDir = projectDir
	args = ['tools/shaderpatcher/fixtures']
}
tasks.named('patcherFixtures') { finalizedBy 'patcherFixturesTs', 'patcherRunTest' }
tasks.named('check') { dependsOn 'patcherFixtures' }
// The separate OvvarShaderPatcher.jar is retired: the patcher players double-click is the ovvar-client jar.
evaluationDependsOn(':mods:ovvar-client')
def clientJar = project(':mods:ovvar-client').tasks.named('jar')

// The game tests run inside a server: JAVA_TOOL_OPTIONS="-Dfabric-api.gametest=true" ./gradlew
// :mods:ovvar:runServer. A dev server already running here holds ./run's world lock, so -PrunDir=<dir>
// (absolute or relative) sends a test run to a world of its own instead of asking for that one back.
loom {
	runs {
		server {
			runDir = project.findProperty('runDir') ?: 'run'
		}
	}
}

// The client's golden combinations (ComboAssetsParityTests): the game tests compare the combination pack to
// src/combo/goldens.json, which mods/ovvar-client's unit test reads; -PupdateComboGoldens rewrites it.
tasks.matching { it.name == 'runGameTest' || it.name == 'runServer' }.configureEach {
	jvmArgs "-Dovvar.comboGoldens=${file('src/combo/goldens.json').absolutePath}"
	if (project.hasProperty('updateComboGoldens')) jvmArgs '-Dovvar.comboGoldens.update=true'
}

// A dev tool: the wardrobe screen composited to a PNG (WardrobeSheet), so the paper doll can be
// looked at without starting a client. Needs runDatagen to have run (it reads the generated
// equipment textures off the runtime classpath).
tasks.register('wardrobeSheet', JavaExec) {
	group = 'ovvar'
	description = 'Writes the wardrobe screen (background + paper doll + slot markers) to -Psheet=<path>.'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'metacraft.ovvar.pack.WardrobeSheet'
	args = [project.findProperty('sheet') ?: '/tmp/wardrobe_v3_sheet.png', project.findProperty('chapter') ?: 'data', project.findProperty('sheetState') ?: 'sewn']
}

// The same client tests under a shaderpack: -Piris=<shaderpack .zip> adds Iris and Sodium to the test client
// and turns that pack on (ported from nether-rifts). With -Povvar.iris.expect=checker|art the client run also
// does unpatchedPackShowsChecker (an unpatched pack shows the magenta/black checker on the right limbs, a pack
// patched by the shader patcher (the ovvar-client jar) does not). Gradle -D flags do not reach the forked game JVM, so both
// properties are turned into jvmArgs here. A missing pack file fails the run before the client starts.
def clientMod = project.hasProperty('ovvarClientMod') || project.hasProperty('shaderpatchMod')
if (project.hasProperty('iris')) {
	def pack = file(project.property('iris'))
	dependencies {
		gametestRuntimeOnly("maven.modrinth:iris:1.11.7+26.3-fabric")
		gametestRuntimeOnly("maven.modrinth:sodium:mc26.3-0.9.3-alpha.1-fabric")
	}
	tasks.named('runClientGameTest') {
		def runDir = file('build/run/clientGameTest')
		// With -PovvarClientMod the client mod switches Iris to the patched copy, which is the pack to expect.
		def expectedPack = clientMod ? pack.name.replaceAll(/\.zip$/, '') + '+ovvar.zip' : pack.name
		jvmArgs "-Dovvar.iris.pack=${expectedPack}"
		doFirst {
			if (!pack.isFile()) throw new GradleException("Ovvar: -Piris=${pack} is not a file")
			delete fileTree("$runDir/shaderpacks")
			project.copy { from pack; into "$runDir/shaderpacks" }
			file("$runDir/config").mkdirs()
			file("$runDir/config/iris.properties").text = "enableShaders=true\nshaderPack=${pack.name}\n"
		}
	}
}
// -PovvarClientMod (old name -PshaderpatchMod still works) puts the ovvar-client mod (mods/ovvar-client) on the
// client test's runtime. Under -Piris, with the ORIGINAL pack, it must write <pack>+ovvar.zip and switch
// iris.properties to it at preLaunch, so the run needs no hand patching. Without -Piris it is the modded-client
// run: the test client draws the combinations itself and the server sends it no combination pack (cloud only,
// see README "The ovvar-client mod").
if (clientMod) {
	dependencies {
		gametestRuntimeOnly project(path: ':mods:ovvar-client')
	}
}
// -PtextColours: NametagColoursClientTests runs (chapter colours on nametags). The test copy of the
// chapter-text-colors resource pack goes into the client run dir's resourcepacks, and the test selects it
// itself (the client writes that to options.txt) and deselects it when done. Meant with -Piris=<pack> (and
// -PovvarClientMod, which patches it); without -Piris it is the no-shader control, where the resource pack
// alone must recolour the tags. Every run first removes the pack from the run dir, so a -PtextColours run that
// was killed before deselecting it cannot leave it recolouring text in the next, ordinary run.
tasks.matching { it.name == 'runClientGameTest' }.configureEach {
	def textPack = file('build/run/clientGameTest/resourcepacks/chapter-text-colors')
	def textColours = project.hasProperty('textColours')
	if (textColours) jvmArgs '-Dovvar.textColours=chapter-text-colors'
	doFirst {
		delete textPack
		if (textColours) project.copy { from 'tools/shaderpatcher/test-packs/chapter-text-colors'; into textPack }
	}
}
if (project.hasProperty('ovvar.iris.expect')) {
	if (!project.hasProperty('iris')) throw new GradleException('Ovvar: -Povvar.iris.expect needs -Piris=<shaderpack .zip>')
	tasks.matching { it.name == 'runClientGameTest' }.configureEach {
		jvmArgs "-Dovvar.iris.expect=${project.property('ovvar.iris.expect')}"
	}
}

processResources {
	// The ovvar-client jar (also the double-clickable patcher) and the patcher's README ride along in the
	// mod's resources, for autohost to serve (pack/ShaderPatcher); an implicit dependency on its jar task.
	from(clientJar) {
		into 'assets/ovvar/shaderpatcher'
		rename { 'ovvar-client.jar' }
	}
	from('tools/shaderpatcher/README.txt') { into 'assets/ovvar/shaderpatcher' }
	doFirst {
		def gen = file('src/main/generated/assets/ovvar/equipment')
		def generating = gradle.startParameter.taskNames.any { it.endsWith('runDatagen') }
		if (!generating && (!gen.isDirectory() || gen.list().length == 0)) {
			throw new GradleException("Ovvar: generated assets missing — run './gradlew runDatagen' first.")
		}
	}
}
